packages:
  - 'packages/*'
  - 'svelte/'

shellEmulator: true
ignoreWorkspaceRootCheck: true

peerDependencyRules:
  allowAny:
    - eslint

allowBuilds:
  '@percy/core': true
  esbuild: true
  msw: true
  core-js: false
  sharp: true
  protobufjs: false

patchedDependencies:
  '@pierre/trees@*': patches/@pierre__trees.patch
