[package]
name = "crates_io_worker"
version = "0.0.0"
license = "MIT OR Apache-2.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
anyhow = "=1.0.104"
diesel = { version = "=2.3.12", features = ["postgres", "serde_json"] }
diesel-async = { version = "=0.9.2", features = ["async-connection-wrapper", "deadpool", "postgres"] }
futures-util = "=0.3.34"
sentry-core = { version = "=0.49.2", features = ["client"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["macros", "rt", "sync", "time"]}
tracing = "=0.1.44"

[dev-dependencies]
claims = "=0.8.0"
crates_io_test_db = { path = "../crates_io_test_db" }
insta = { version = "=1.48.0", features = ["json"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync"]}
