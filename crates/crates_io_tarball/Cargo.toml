[package]
name = "crates_io_tarball"
version = "0.0.0"
license = "MIT OR Apache-2.0"
edition = "2024"

[lints]
workspace = true

[features]
builder = ["dep:flate2", "dep:tar"]

[dependencies]
astral-tokio-tar = { version = "=0.6.2", default-features = false }
crates_io_cargo_toml = { path = "../crates_io_cargo_toml" }
flate2 = { version = "=1.1.9", optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tar = { version = "=0.4.46", optional = true, default-features = false }
thiserror = "=2.0.19"
tracing = "=0.1.44"
tokio = { version = "=1.53.0", features = ["io-util", "macros", "rt-multi-thread"] }
async-compression = { version = "=0.4.42", default-features = false, features = ["gzip", "tokio"] }
futures-util = "=0.3.33"

[dev-dependencies]
anyhow = "=1.0.104"
claims = "=0.8.0"
clap = { version = "=4.6.2", features = ["derive", "unicode", "wrap_help"] }
flate2 = { version = "=1.1.9" }
indicatif = { version = "=0.18.6", features = ["rayon"] }
insta = "=1.48.0"
rayon = "=1.12.0"
tar = { version = "=0.4.46", default-features = false }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
walkdir = "=2.5.0"
