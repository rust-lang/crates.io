[package]
name = "crates_io_database"
version = "0.0.0"
license = "MIT OR Apache-2.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
bon = "=3.10.0"
chrono = { version = "=0.4.45", default-features = false, features = ["serde"] }
crates_io_index = { path = "../crates_io_index" }
crates_io_validation = { path = "../crates_io_validation" }
diesel = { version = "=2.3.12", features = ["serde_json", "chrono", "numeric"] }
diesel-async = { version = "=0.9.2", features = ["postgres"] }
diesel_full_text_search = "=2.3.0"
rand = "=0.10.2"
secrecy = "=0.10.3"
semver = { version = "=1.0.28", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["macros"] }
tracing = "=0.1.44"
utoipa = { version = "=5.5.0", features = ["chrono"] }

[dev-dependencies]
claims = "=0.8.0"
crates_io_test_db = { path = "../crates_io_test_db" }
googletest = "=0.14.3"
insta = { version = "=1.48.0", features = ["filters", "json"] }
tokio = { version = "=1.53.1", features = ["macros", "rt"] }
