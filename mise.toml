# `mise.toml` file for the mise version manager (https://mise.jdx.dev)
#
# This file specifies the versions of various tools to be used in this project.
# Some of these tools are also used by our Heroku buildpack setup.
[tools]
cargo-insta = "1.48.0"
"cargo:cargo-deny" = "0.19.9"
"cargo:cargo-machete" = "0.9.2"
"cargo:diesel-guard" = "0.12.0"
node = "24.18.0"
pnpm = "11.9.0"
zizmor = "1.26.1"
