# `mise.toml` file for the mise version manager (https://mise.jdx.dev)
#
# This file specifies the versions of various tools to be used in this project.
# Some of these tools are also used by our Heroku buildpack setup.

# Read the Node.js and pnpm versions from `devEngines` in `package.json`.
[settings]
idiomatic_version_file_enable_tools = ["node", "pnpm"]

[tools]
cargo-insta = "1.49.0"
"cargo:cargo-deny" = "0.20.2"
"cargo:diesel_cli" = { version = "2.4.0", features = "postgres", default-features = false }
"cargo:diesel-guard" = "0.12.0"
zizmor = "1.32.0"
